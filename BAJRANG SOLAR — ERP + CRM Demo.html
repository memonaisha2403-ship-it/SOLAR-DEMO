<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>BAJRANG SOLAR — ERP + CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f5f8;--card:#fff;--tx:#14213d;--mut:#6b7686;--bd:#e4e8ee;--ac:#f5a300;--ac2:#e8590c;--ok:#1f9d55;--bad:#d64545;--side:#14213d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1522;--card:#17202f;--tx:#e8edf5;--mut:#93a0b4;--bd:#273246;--side:#0a1019}}
:root[data-theme="dark"]{--bg:#0e1522;--card:#17202f;--tx:#e8edf5;--mut:#93a0b4;--bd:#273246;--side:#0a1019}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}.side{width:224px;background:var(--side);color:#cfd6e4;padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
.logo{display:flex;gap:10px;align-items:center;color:#fff;padding:4px 8px 14px}.logo i{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-style:normal;font-size:18px}
.logo b{display:block;letter-spacing:.8px}.logo small{color:#9aa6bb;font-size:11px}
.nav a{display:block;padding:8px 12px;border-radius:8px;cursor:pointer;margin:1px 0}.nav a:hover{background:#ffffff14}.nav a.on{background:var(--ac);color:#14213d;font-weight:600}
.main{flex:1;min-width:0}.top{display:flex;gap:10px;align-items:center;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top input{flex:1;max-width:380px;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.pad{padding:20px}h1{font-size:20px;margin:0 0 4px}.crumb{color:var(--mut);font-size:12px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}.card h3{margin:0 0 10px;font-size:14px}
.kpi small{color:var(--mut)}.kpi b{display:block;font-size:22px;margin-top:2px}
.btn{background:var(--ac);color:#14213d;border:0;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer}.btn.s{background:var(--bg);border:1px solid var(--bd);color:var(--tx);font-weight:500;padding:5px 10px;font-size:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mut);font-size:12px;font-weight:600;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}td{padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.bd{padding:2px 9px;border-radius:99px;font-size:12px;background:#f5a30026;color:#b36b00}.bd.ok{background:#1f9d5524;color:var(--ok)}.bd.bad{background:#d6454524;color:var(--bad)}
select.st{border:1px solid var(--bd);border-radius:6px;padding:3px;background:var(--card)}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}.bar span:first-child{width:110px;color:var(--mut);flex:none}.bar div{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.tool{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.tool input,.tool select,.f input,.f select{padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:20;padding:16px}.modal .card{width:min(440px,100%);max-height:90vh;overflow:auto}
.f label{display:block;font-size:12px;color:var(--mut);margin-top:8px}.f input,.f select{width:100%}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--side);color:#fff;padding:10px 16px;border-radius:8px;z-index:30}
.step{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.step i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:var(--bd);font-size:12px;flex:none}.step.d i{background:var(--ok);color:#fff}
.pg{height:8px;background:var(--bd);border-radius:6px;min-width:90px}.pg div{height:8px;border-radius:6px;background:var(--ok)}
#login{display:grid;place-items:center;min-height:100vh;padding:16px}#login .card{width:min(380px,100%);padding:26px}
@media(max-width:800px){.side{position:fixed;left:-240px;z-index:15;transition:.2s}.side.o{left:0}#mb{display:inline-block!important}}
#mb{display:none}
</style></head><body>
<div id="root"></div>
<script>
const R=n=>'₹'+Math.round(n).toLocaleString('en-IN'),$=s=>document.querySelector(s);
const pick=(a,i)=>a[i%a.length];
const CITY=['Himatnagar','Ahmedabad','Gandhinagar','Mehsana','Modasa','Vadodara','Surat'],SRC=['Website','WhatsApp','Phone Call','Facebook','Instagram','Google','Referral','Walk-in','Dealer'];
const NM=['Rahul Patel','Amit Shah','Kiran Desai','Hetal Mehta','Jignesh Modi','Pooja Trivedi','Nilesh Parmar','Dipak Joshi','Mital Raval','Sanjay Solanki','Bhavin Thakkar','Rina Vyas','Harsh Pandya','Jaydeep Chauhan','Komal Bhatt','Mahesh Rathod','Alpa Soni','Vishal Dave','Nirav Gajjar','Payal Kothari','Ketan Zala','Dhruv Brahmbhatt','Sneha Panchal','Tejas Rana','Mukesh Prajapati'];
const EMP=['Arjun Sharma|Sales','Meera Joshi|Sales','Vivek Patel|Survey','Rohan Dave|Project Management','Imran Khan|Installation','Suresh Makwana|Installation','Nita Shah|Inventory','Kunal Mehta|Accounts','Ravi Chauhan|Service','Dinesh Prajapati|Installation'].map((s,i)=>({id:'E-'+(101+i),name:s.split('|')[0],dept:s.split('|')[1],mobile:'98250'+(10000+i*137),status:'Active'}));
const SALES=['Arjun Sharma','Meera Joshi'];
const DB={
leads:NM.map((n,i)=>({id:'L-'+(1000+i),name:n,mobile:'97230'+(20000+i*311),city:pick(CITY,i),source:pick(SRC,i*3),kw:[3,5,5,10,7,3,15,5][i%8],bill:2500+i*350,owner:pick(SALES,i),status:i==0?'Interested':pick(['New','Contacted','Interested','Quotation Sent','Negotiation','Follow-up','Won','Lost'],i),follow:'2026-10-'+String(7+i%20).padStart(2,'0')})),
customers:[],surveys:[],quotes:[],orders:[],projects:[],payments:[],amc:[],log:[],
products:[['SP-540','Mono PERC Panel 540W','Solar Panel',9800,120,40],['SP-545T','TOPCon Panel 545W','Solar Panel',11200,90,40],['IN-5G','On-Grid Inverter 5kW','Inverter',42000,14,4],['IN-10G','On-Grid Inverter 10kW','Inverter',78000,3,4],['IN-5H','Hybrid Inverter 5kW','Inverter',68000,5,3],['ST-RT','Rooftop Structure (per kW)','Structure',4500,60,20],['CB-DC','DC Cable 4mm (m)','Cable',55,900,300],['EK-01','Earthing Kit','Other',3800,18,8],['LA-01','Lightning Arrestor','Other',2600,12,6],['BT-LI','Lithium Battery 5kWh','Battery',95000,4,2]].map(a=>({code:a[0],name:a[1],cat:a[2],price:a[3],stock:a[4],min:a[5]})),
suppliers:['Gujarat PV Traders|Ahmedabad|184000','SunGrid Components|Surat|92000','Meghraj Electricals|Mehsana|0','Narmada Structures|Vadodara|46000','Aarav Cables|Gandhinagar|12000'].map((s,i)=>{s=s.split('|');return{id:'S-'+(1+i),name:s[0],city:s[1],terms:['30 days','15 days','Advance','45 days','30 days'][i],due:+s[2]}}),
tickets:[]};
DB.customers=NM.slice(1,16).map((n,i)=>({id:'C-'+(2000+i),name:n,city:pick(CITY,i+1),mobile:DB.leads[i+1].mobile,type:pick(['Residential','Commercial','Industrial'],i),discom:'UGVCL',gst:i%3==2?'24AAAC'+i+'1234A1Z5':'—'}));
const q0=(i,kw)=>{const sub=kw*52000,d=sub*.02,g=(sub-d)*.089;return{sub,d,g,tot:sub-d+g}};
DB.quotes=DB.customers.slice(0,10).map((c,i)=>{const kw=[3,5,5,10,7,3,15,5,5,10][i],t=q0(i,kw);return{id:'Q-'+(3001+i),cust:c.name,kw,total:Math.round(t.tot),owner:pick(SALES,i),status:pick(['Draft','Sent','Viewed','Negotiation','Accepted','Accepted','Rejected','Sent','Accepted','Expired'],i)}});
DB.orders=DB.quotes.filter(q=>q.status=='Accepted').concat(DB.quotes.slice(0,4)).slice(0,8).map((q,i)=>({id:'O-'+(4001+i),cust:q.cust,kw:q.kw,total:q.total,adv:Math.round(q.total*.3),status:pick(['Confirmed','Material Pending','Scheduled','Installation Started','Commissioned'],i),pm:'Rohan Dave',quote:q.id}));
DB.projects=DB.orders.slice(0,6).map((o,i)=>({id:'P-'+(5001+i),cust:o.cust,order:o.id,kw:o.kw,rev:o.total,cost:Math.round(o.total*.78),stage:[2,4,6,8,10,12][i],team:pick(['Team A','Team B'],i),done:i>=3}));
DB.payments=DB.orders.slice(0,8).map((o,i)=>({id:'PAY-'+(6001+i),cust:o.cust,order:o.id,amt:o.adv,method:pick(['UPI','Bank Transfer','Cheque','Cash'],i),date:'2026-09-'+String(5+i*3).padStart(2,'0'),type:'Advance'})).concat(DB.orders.slice(3,5).map((o,i)=>({id:'PAY-'+(6101+i),cust:o.cust,order:o.id,amt:Math.round(o.total*.5),method:'Bank Transfer',date:'2026-09-28',type:'Second'})));
DB.tickets=DB.customers.slice(0,10).map((c,i)=>({id:'T-'+(7001+i),cust:c.name,issue:pick(['Panel Issue','Inverter Issue','Generation Issue','Cleaning','Monitoring Issue','Maintenance'],i),priority:pick(['Low','Medium','High'],i),tech:'Ravi Chauhan',status:pick(['Open','Assigned','Visit Scheduled','In Progress','Resolved','Closed'],i)}));
const STAGES=['Order Confirmed','Site Survey','Design Approved','Material Planning','Material Allocated','Installation Scheduled','Installation Started','Installation Completed','Inspection','Commissioning','Handover','Project Completed'];
const paid=o=>DB.payments.filter(p=>p.order==o).reduce((a,p)=>a+p.amt,0);
const bal=o=>o.total-paid(o.id);
// ---- page config ----
const C={
leads:{t:'Leads (CRM)',d:'leads',cols:[['id','ID'],['name','Customer'],['city','City'],['source','Source'],['kw','kW'],['owner','Owner'],['follow','Follow-up'],['status','Status']],st:['New','Contacted','Interested','Site Survey Required','Quotation Sent','Negotiation','Won','Lost','Follow-up'],pre:'L-',form:[['name','Customer Name'],['mobile','Mobile'],['city','City','s',CITY],['source','Lead Source','s',SRC],['kw','Required kW','n'],['bill','Monthly Bill ₹','n'],['owner','Assign To','s',SALES],['follow','Follow-up Date','d']],def:{status:'New'},act:[['WhatsApp',r=>window.open('https://wa.me/91'+r.mobile)],['Convert',r=>convLead(r)]]},
customers:{t:'Customers',d:'customers',cols:[['id','ID'],['name','Name'],['city','City'],['mobile','Mobile'],['type','Property'],['discom','DISCOM'],['gst','GST']],pre:'C-',form:[['name','Name'],['mobile','Mobile'],['city','City','s',CITY],['type','Property Type','s',['Residential','Commercial','Industrial']]],def:{discom:'UGVCL',gst:'—'},act:[['360° View',r=>cust360(r)]]},
surveys:{t:'Site Surveys',d:'surveys',cols:[['id','ID'],['cust','Customer'],['eng','Engineer'],['roof','Roof'],['area','Area sqft'],['units','Units/mo'],['kw','Recommended kW'],['panels','Panels'],['status','Status']],st:['Scheduled','Assigned','In Progress','Completed','Reviewed'],pre:'SV-',form:[['cust','Customer','s',()=>DB.customers.map(c=>c.name)],['eng','Survey Engineer','s',['Vivek Patel']],['roof','Roof Type','s',['RCC','Metal Sheet','Tin']],['area','Shadow-free Area (sqft)','n'],['units','Monthly Units','n']],def:{status:'Scheduled'},calc:r=>{r.kw=Math.max(1,Math.ceil(r.units/120));r.panels=Math.ceil(r.kw*1000/545)}},
products:{t:'Products & Inventory',d:'products',cols:[['code','Code'],['name','Product'],['cat','Category'],['price','Price','r'],['stock','Stock'],['min','Min'],['alert','Stock Alert']],form:[['code','Code'],['name','Name'],['cat','Category','s',['Solar Panel','Inverter','Structure','Cable','Battery','Other']],['price','Price ₹','n'],['stock','Opening Stock','n'],['min','Min Stock','n']],act:[['+ Stock In',r=>{r.stock+=10;toast('Stock +10 — '+r.name);go()}]]},
suppliers:{t:'Suppliers',d:'suppliers',cols:[['id','ID'],['name','Supplier'],['city','City'],['terms','Terms'],['due','Outstanding','r']],pre:'S-',form:[['name','Supplier'],['city','City','s',CITY],['terms','Payment Terms','s',['Advance','15 days','30 days','45 days']]],def:{due:0}},
quotes:{t:'Quotations',d:'quotes',cols:[['id','Quote #'],['cust','Customer'],['kw','kW'],['total','Grand Total','r'],['owner','Salesperson'],['status','Status']],st:['Draft','Sent','Viewed','Negotiation','Accepted','Rejected','Expired'],pre:'Q-',form:[['cust','Customer','s',()=>DB.customers.map(c=>c.name)],['kw','System kW','n'],['disc','Discount %','n'],['owner','Salesperson','s',SALES]],calc:r=>{const t=q0(0,r.kw),d=t.sub*(r.disc||0)/100;r.total=Math.round(t.sub-d+(t.sub-d)*.089)},def:{status:'Draft'},act:[['→ Order',r=>mkOrder(r)],['Print',()=>print()]]},
orders:{t:'Orders',d:'orders',cols:[['id','Order'],['cust','Customer'],['kw','kW'],['total','Total','r'],['adv','Advance','r'],['balance','Balance','r'],['status','Status']],st:['Confirmed','Material Pending','Scheduled','Installation Started','Installation Completed','Commissioned','Cancelled'],act:[['→ Project',r=>mkProject(r)]]},
projects:{t:'Projects & Installations',d:'projects',cols:[['id','Project'],['cust','Customer'],['kw','kW'],['team','Team'],['rev','Revenue','r'],['profit','Profit','r'],['progress','Progress'],['stagename','Stage']],act:[['Advance Stage',r=>advance(r)],['Allocate Material',r=>allocate(r)]]},
payments:{t:'Payments & Invoices',d:'payments',cols:[['id','Receipt'],['cust','Customer'],['order','Order'],['type','Type'],['amt','Amount','r'],['method','Method'],['date','Date']],pre:'PAY-',form:[['order','Order','s',()=>DB.orders.map(o=>o.id)],['amt','Amount ₹','n'],['type','Type','s',['Advance','Second','Final']],['method','Method','s',['Cash','Bank Transfer','UPI','Cheque']]],calc:r=>{r.cust=DB.orders.find(o=>o.id==r.order).cust;r.date='2026-10-06'}},
tickets:{t:'Service & AMC',d:'tickets',cols:[['id','Ticket'],['cust','Customer'],['issue','Issue'],['priority','Priority'],['tech','Technician'],['status','Status']],st:['Open','Assigned','Visit Scheduled','In Progress','Resolved','Closed'],pre:'T-',form:[['cust','Customer','s',()=>DB.customers.map(c=>c.name)],['issue','Issue','s',['Panel Issue','Inverter Issue','Generation Issue','Wiring Issue','Cleaning','Maintenance']],['priority','Priority','s',['Low','Medium','High']]],def:{status:'Open',tech:'Ravi Chauhan'}},
employees:{t:'Employees',d:'EMP',cols:[['id','ID'],['name','Name'],['dept','Department'],['mobile','Mobile'],['status','Status']],pre:'E-',form:[['name','Name'],['dept','Department','s',['Sales','Survey','Installation','Project Management','Inventory','Accounts','Service']],['mobile','Mobile']],def:{status:'Active'}},
amc:{t:'AMC & Warranty',d:'amc',cols:[['id','AMC'],['cust','Customer'],['start','Start'],['end','End'],['next','Next Service'],['freq','Frequency'],['status','Status']]}
};
const NAV=[['dash','Dashboard'],['journey','★ Customer Journey'],['leads','Leads'],['customers','Customers'],['surveys','Site Surveys'],['est','Solar Estimator'],['quotes','Quotations'],['orders','Orders'],['projects','Projects'],['products','Inventory'],['suppliers','Suppliers'],['payments','Payments'],['tickets','Service'],['amc','AMC'],['employees','Employees'],['reports','Reports'],['alerts','Notifications']];
const ROLES={'Super Admin':'*','Admin':'*','Sales Manager':'leads customers surveys est quotes orders reports','Sales Executive':'leads customers est quotes','Survey Engineer':'surveys est','Project Manager':'orders projects products','Installation Team':'projects','Inventory Manager':'products suppliers','Accountant':'payments reports orders','Service/Maintenance Team':'tickets amc customers'};
let role='Admin',page='dash',S={},EMPL=DB.EMP=EMP;
// ---- derived ----
const rows=k=>{const c=C[k];let a=(c.d=='EMP'?EMP:DB[c.d]);return a.map(r=>{r.alert=r.stock!=null?(r.stock<=r.min?'LOW':'OK'):undefined;if(k=='orders')r.balance=bal(r);if(k=='projects'){r.profit=r.rev-r.cost;r.stagename=STAGES[r.stage-1];r.progress=Math.round(r.stage/12*100)}return r})};
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)};
const badge=v=>{const g=/Won|Accepted|Completed|Resolved|Closed|Active|OK|Commissioned|Reviewed/.test(v),b=/Lost|Rejected|LOW|Expired|Cancelled|High/.test(v);return `<span class="bd ${g?'ok':b?'bad':''}">${v}</span>`};
function table(k){const c=C[k],s=S[k]=S[k]||{q:'',f:'',p:0};let a=rows(k);
 a=a.filter(r=>(!s.q||JSON.stringify(r).toLowerCase().includes(s.q.toLowerCase()))&&(!s.f||r.status==s.f));
 const pages=Math.max(1,Math.ceil(a.length/10)),v=a.slice(s.p*10,s.p*10+10);
 return `<div class="tool"><input id="q" placeholder="Search…" value="${s.q}" oninput="S['${k}'].q=this.value;S['${k}'].p=0;go(1)">${c.st?`<select onchange="S['${k}'].f=this.value;go()"><option value="">All status</option>${c.st.map(x=>`<option ${s.f==x?'selected':''}>${x}</option>`).join('')}</select>`:''}${c.form?`<button class="btn" onclick="form('${k}')">+ Add</button>`:''}<button class="btn s" onclick="csv('${k}')">Export CSV</button></div>
 <div class="card tw"><table><tr>${c.cols.map(x=>`<th>${x[1]}</th>`).join('')}<th></th></tr>${v.map((r,i)=>`<tr>${c.cols.map(x=>{let val=r[x[0]];if(val==null)val='—';if(x[2]=='r')val=R(val);else if(x[0]=='status'&&c.st)val=`<select class="st" onchange="setSt('${k}','${r.id}',this.value)">${c.st.map(o=>`<option ${o==val?'selected':''}>${o}</option>`).join('')}</select>`;else if(x[0]=='alert'||x[0]=='priority')val=badge(val);else if(x[0]=='progress')val=`<div class="pg"><div style="width:${val}%"></div></div>`;else if(x[0]=='status')val=badge(val);return `<td>${val}</td>`}).join('')}<td>${(c.act||[]).map((a,j)=>`<button class="btn s" onclick="act('${k}',${a[2]??j},${i+s.p*10})">${a[0]}</button>`).join(' ')}</td></tr>`).join('')||'<tr><td colspan=9>No records found</td></tr>'}</table></div>
 <div class="tool" style="margin-top:10px"><button class="btn s" onclick="S['${k}'].p=Math.max(0,S['${k}'].p-1);go()">‹ Prev</button><span>Page ${s.p+1}/${pages} · ${a.length} records</span><button class="btn s" onclick="S['${k}'].p=Math.min(${pages-1},S['${k}'].p+1);go()">Next ›</button></div>`}
let _f=null;
function filtered(k){const s=S[k];return rows(k).filter(r=>(!s.q||JSON.stringify(r).toLowerCase().includes(s.q.toLowerCase()))&&(!s.f||r.status==s.f))}
const act=(k,j,i)=>C[k].act[j][1](filtered(k)[i]);
function setSt(k,id,v){const r=rows(k).find(r=>r.id==id);r.status=v;toast(id+' → '+v)}
function csv(k){const c=C[k],a=rows(k),t=[c.cols.map(x=>x[1])].concat(a.map(r=>c.cols.map(x=>r[x[0]]))).map(r=>r.join(',')).join('\n');const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([t]));l.download=k+'.csv';l.click()}
function form(k){const c=C[k];const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card f"><h3>Add — ${c.t}</h3>${c.form.map(f=>{const o=typeof f[3]=='function'?f[3]():f[3];return `<label>${f[1]}</label>`+(f[2]=='s'?`<select name="${f[0]}">${o.map(x=>`<option>${x}</option>`).join('')}</select>`:`<input name="${f[0]}" type="${f[2]=='n'?'number':f[2]=='d'?'date':'text'}">`)}).join('')}<div class="tool" style="margin-top:14px"><button class="btn" id="sv">Save</button><button class="btn s" onclick="this.closest('.modal').remove()">Cancel</button></div></div>`;document.body.appendChild(m);
 $('#sv').onclick=()=>{const r={...(c.def||{})};m.querySelectorAll('[name]').forEach(e=>r[e.name]=e.type=='number'?+e.value:e.value);if(!r.name&&!r.cust&&!r.code&&!r.order)return toast('Please fill the form');const a=c.d=='EMP'?EMP:DB[c.d];if(c.pre)r.id=c.pre+(a.length+1000+Math.floor(Math.random()*50));if(c.calc)c.calc(r);a.unshift(r);m.remove();toast('Saved successfully');go()}}
// ---- workflows ----
function convLead(l){if(DB.customers.find(c=>c.name==l.name))return toast('Already a customer');const c={id:'C-'+(2100+DB.customers.length),name:l.name,city:l.city,mobile:l.mobile,type:'Residential',discom:'UGVCL',gst:'—'};DB.customers.unshift(c);l.status='Won';toast('Lead converted to customer '+c.id);go();return c}
function mkOrder(q){if(q.status!='Accepted'){q.status='Accepted'}if(DB.orders.find(o=>o.quote==q.id))return toast('Order already exists');const o={id:'O-'+(4100+DB.orders.length),cust:q.cust,kw:q.kw,total:q.total,adv:Math.round(q.total*.3),status:'Confirmed',pm:'Rohan Dave',quote:q.id};DB.orders.unshift(o);DB.payments.unshift({id:'PAY-'+(6200+DB.payments.length),cust:q.cust,order:o.id,amt:o.adv,method:'UPI',date:'2026-10-06',type:'Advance'});toast('Order '+o.id+' created with 30% advance receipt');go();return o}
function mkProject(o){if(DB.projects.find(p=>p.order==o.id))return toast('Project exists');const p={id:'P-'+(5100+DB.projects.length),cust:o.cust,order:o.id,kw:o.kw,rev:o.total,cost:Math.round(o.total*.78),stage:3,team:'Team A',done:false};DB.projects.unshift(p);o.status='Scheduled';toast('Project '+p.id+' generated');go();return p}
function allocate(p){const kw=p.kw,use=[['SP-540',Math.ceil(kw*1000/540)],[kw>5?'IN-10G':'IN-5G',1],['ST-RT',kw],['CB-DC',kw*20],['EK-01',1],['LA-01',1]],out=[];use.forEach(([c,n])=>{const pr=DB.products.find(x=>x.code==c);pr.stock=Math.max(0,pr.stock-n);out.push(n+'× '+pr.name)});if(p.stage<5)p.stage=5;toast('Inventory updated: '+out.length+' items issued');go();return out}
function advance(p){if(p.stage>=12)return toast('Project already completed');p.stage++;const o=DB.orders.find(o=>o.id==p.order);if(o){if(p.stage==7)o.status='Installation Started';if(p.stage==8)o.status='Installation Completed';if(p.stage==10)o.status='Commissioned'}if(p.stage==12)p.done=true;toast(p.id+' → '+STAGES[p.stage-1]);go()}
function cust360(c){const o=DB.orders.filter(o=>o.cust==c.name),m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card"><h3>${c.name} — 360° Profile</h3><p>${c.id} · ${c.mobile} · ${c.city}<br>${c.type} · ${c.discom}</p><p><b>Quotations:</b> ${DB.quotes.filter(q=>q.cust==c.name).map(q=>q.id+' ('+q.status+')').join(', ')||'—'}<br><b>Orders:</b> ${o.map(x=>x.id+' bal '+R(bal(x))).join(', ')||'—'}<br><b>Projects:</b> ${DB.projects.filter(p=>p.cust==c.name).map(p=>p.id+' '+STAGES[p.stage-1]).join(', ')||'—'}<br><b>Tickets:</b> ${DB.tickets.filter(t=>t.cust==c.name).map(t=>t.id+' '+t.status).join(', ')||'—'}</p><button class="btn" onclick="this.closest('.modal').remove()">Close</button></div>`;document.body.appendChild(m)}
// ---- journey ----
const J={n:0,log:[],cust:null,q:null,o:null,p:null};
const JS=[['Lead "Rahul Patel" is Interested',()=>{const l=DB.leads[0];l.status='Interested';return 'Lead '+l.id+' — Himatnagar, interested in rooftop solar'}],
['Convert lead to customer',()=>{J.cust=convLead(DB.leads[0]);return 'Customer '+J.cust.id+' created'}],
['Site survey → recommend 5 kW',()=>{DB.surveys.unshift({id:'SV-1900',cust:'Rahul Patel',eng:'Vivek Patel',roof:'RCC',area:480,units:600,kw:5,panels:10,status:'Completed'});return '600 units/mo ÷ 120 = 5 kW · 10 panels × 545W · 480 sqft roof'}],
['Create quotation',()=>{const t=q0(0,5);J.q={id:'Q-3900',cust:'Rahul Patel',kw:5,total:Math.round(t.tot),owner:'Arjun Sharma',status:'Sent'};DB.quotes.unshift(J.q);return `Subtotal ${R(t.sub)} − discount ${R(t.d)} + GST ${R(t.g)} = ${R(t.tot)}`}],
['Quotation accepted → Order',()=>{J.q.status='Accepted';J.o=mkOrder(J.q);return 'Order '+J.o.id+' · advance '+R(J.o.adv)+' · balance '+R(bal(J.o))}],
['Order → Project, allocate materials',()=>{J.p=mkProject(J.o);const m=allocate(J.p);return 'Project '+J.p.id+'; stock deducted: '+m.join(', ')}],
['Installation scheduled → started → completed',()=>{J.p.stage=8;J.o.status='Installation Completed';return 'Checklist 14/14 complete, project at "Installation Completed"'}],
['Commissioning',()=>{J.p.stage=10;J.o.status='Commissioned';return 'Net-meter inspection passed · system commissioned'}],
['Final payment received',()=>{const b=bal(J.o);DB.payments.unshift({id:'PAY-6999',cust:'Rahul Patel',order:J.o.id,amt:b,method:'Bank Transfer',date:'2026-10-06',type:'Final'});return 'Received '+R(b)+' · Outstanding now '+R(bal(J.o))}],
['Warranty activated + AMC created',()=>{J.p.stage=12;J.p.done=true;DB.amc.unshift({id:'AMC-801',cust:'Rahul Patel',start:'2026-10-06',end:'2027-10-05',next:'2027-01-06',freq:'Quarterly',status:'Active'});return 'Panel 25-yr / inverter 10-yr warranty active · AMC-801 (quarterly)'}]];
function jstep(){if(J.n>=JS.length)return;J.log.push(JS[J.n][1]());J.n++;go()}
function journey(){return `<div class="card"><h3>Lead → Customer → Survey → Quote → Order → Project → Install → Payment → Warranty → AMC</h3>${JS.map((s,i)=>`<div class="step ${i<J.n?'d':''}"><i>${i<J.n?'✓':i+1}</i><div><b>${s[0]}</b><br><small style="color:var(--mut)">${J.log[i]||''}</small></div></div>`).join('')}<div class="tool" style="margin-top:12px"><button class="btn" onclick="jstep()">${J.n>=JS.length?'Journey complete':'Run next step ▶'}</button><button class="btn s" onclick="while(J.n<JS.length)jstep()">Run all</button></div></div><p style="color:var(--mut)">Every step writes real records — open Leads, Surveys, Quotations, Orders, Projects, Inventory, Payments and AMC to see them.</p>`}
// ---- views ----
const bars=(o,fmt=x=>x)=>{const m=Math.max(...Object.values(o),1);return Object.entries(o).map(([k,v])=>`<div class="bar"><span>${k}</span><div style="width:${v/m*55}%"></div><span style="width:auto;color:var(--tx)">${fmt(v)}</span></div>`).join('')};
const cnt=(a,k)=>a.reduce((m,r)=>(m[r[k]]=(m[r[k]]||0)+1,m),{});
function dash(){const L=DB.leads,O=DB.orders,rev=DB.payments.reduce((a,p)=>a+p.amt,0),tot=O.reduce((a,o)=>a+o.total,0),low=DB.products.filter(p=>p.stock<=p.min),k=[['Total Leads',L.length],['New Leads',L.filter(l=>l.status=='New').length],['Qualified',L.filter(l=>/Interested|Quotation|Negotiation/.test(l.status)).length],['Site Surveys',DB.surveys.length],['Quotes Sent',DB.quotes.filter(q=>q.status!='Draft').length],['Accepted',DB.quotes.filter(q=>q.status=='Accepted').length],['Orders',O.length],['Ongoing Installs',DB.projects.filter(p=>p.stage>=6&&p.stage<12).length],['Completed',DB.projects.filter(p=>p.done).length],['Revenue Collected',R(rev)],['Outstanding',R(tot-rev)],['kW Sold',O.reduce((a,o)=>a+o.kw,0)+' kW']];
const exec={};DB.quotes.filter(q=>q.status=='Accepted').forEach(q=>exec[q.owner]=(exec[q.owner]||0)+q.total);
return `<div class="tool">${[['Add Lead','leads'],['Create Quotation','quotes'],['Record Payment','payments'],['Add Customer','customers'],['Survey','surveys']].map(a=>`<button class="btn" onclick="nav('${a[1]}');form('${a[1]}')">+ ${a[0]}</button>`).join('')}</div>
<div class="grid">${k.map(x=>`<div class="card kpi"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div>
<div class="grid g2"><div class="card"><h3>Lead Conversion Funnel</h3>${bars(cnt(L,'status'))}</div><div class="card"><h3>Monthly Revenue (₹ L)</h3>${bars({Jun:4.2,Jul:5.8,Aug:7.1,Sep:9.4,Oct:rev/1e5},v=>v.toFixed(1))}</div>
<div class="card"><h3>Installation Status</h3>${bars(cnt(DB.projects.map(p=>({s:p.done?'Completed':p.stage>=6?'Ongoing':'Pending'})),'s'))}</div><div class="card"><h3>Sales by Executive</h3>${bars(exec,R)}</div>
<div class="card"><h3>Lead Source Performance</h3>${bars(cnt(L,'source'))}</div><div class="card"><h3>Low Stock Alerts</h3>${low.map(p=>`<p>⚠ ${p.name}: ${p.stock} (min ${p.min})</p>`).join('')||'All stock healthy'}</div>
<div class="card"><h3>Pending Follow-ups</h3>${L.slice(0,5).map(l=>`<p>${l.follow} · ${l.name} (${l.owner})</p>`).join('')}</div><div class="card"><h3>Recent Payments</h3>${DB.payments.slice(0,5).map(p=>`<p>${p.cust} · ${R(p.amt)} · ${p.method}</p>`).join('')}</div></div>`}
function est(){const g=id=>+($('#'+id)||{value:0}).value;return `<div class="card f" style="max-width:520px"><h3>Solar System Estimator</h3><label>Monthly consumption (units)</label><input id="e1" type="number" value="${S.e1||600}" oninput="S.e1=this.value;estOut()"><label>Roof area (sqft)</label><input id="e2" type="number" value="${S.e2||500}" oninput="S.e2=this.value;estOut()"><label>Type</label><select id="e3" onchange="estOut()"><option>On-Grid</option><option>Hybrid</option><option>Off-Grid</option></select><div id="eo" style="margin-top:14px"></div></div>`}
function estOut(){const u=+$('#e1').value,a=+$('#e2').value,t=$('#e3').value;let kw=Math.max(1,Math.ceil(u/120));const max=Math.floor(a/80);if(kw>max){kw=Math.max(1,max)}const panels=Math.ceil(kw*1000/545),yr=kw*1500,sav=yr*7,cost=kw*52000*(t=='Hybrid'?1.4:1)-(kw>=3?78000:kw*30000),pay=cost/sav;$('#eo').innerHTML=`<div class="grid"><div class="card kpi"><small>System</small><b>${kw} kW ${t}</b></div><div class="card kpi"><small>Panels</small><b>${panels}</b></div><div class="card kpi"><small>Monthly gen.</small><b>${Math.round(yr/12)} units</b></div><div class="card kpi"><small>Annual gen.</small><b>${yr}</b></div><div class="card kpi"><small>Savings / yr</small><b>${R(sav)}</b></div><div class="card kpi"><small>Payback</small><b>${pay.toFixed(1)} yrs</b></div><div class="card kpi"><small>Inverter</small><b>${kw} kW</b></div><div class="card kpi"><small>CO₂ saved</small><b>${(yr*.82/1000).toFixed(1)} t/yr</b></div></div><small style="color:var(--mut)">Calc: kW = units ÷ 120; generation = kW × 1500 kWh/yr; savings @ ₹7/unit; cost net of subsidy.</small>`}
function reports(){const rev=DB.payments.reduce((a,p)=>a+p.amt,0),tot=DB.orders.reduce((a,o)=>a+o.total,0),cost=DB.projects.reduce((a,p)=>a+p.cost,0),kw=DB.projects.reduce((a,p)=>a+p.kw,0);return `<div class="tool"><button class="btn" onclick="print()">Print / Save PDF</button><button class="btn s" onclick="csv('payments')">Export CSV</button></div><div class="grid">${[['Leads',DB.leads.length],['Conversions',DB.leads.filter(l=>l.status=='Won').length],['Order Value',R(tot)],['Collected',R(rev)],['Outstanding',R(tot-rev)],['Project Cost',R(cost)],['Est. Profit',R(DB.projects.reduce((a,p)=>a+p.rev,0)-cost)],['kW Installed',kw],['Est. Generation',kw*1500+' kWh/yr'],['CO₂ Reduction',(kw*1500*.82/1000).toFixed(1)+' t/yr']].map(x=>`<div class="card kpi"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div>`}
function alerts(){const a=[...DB.products.filter(p=>p.stock<=p.min).map(p=>'Low inventory: '+p.name),...DB.leads.slice(0,4).map(l=>'Follow-up due: '+l.name),...DB.quotes.filter(q=>q.status=='Sent').slice(0,3).map(q=>'Quotation expiring: '+q.id),...DB.orders.filter(o=>bal(o)>0).slice(0,3).map(o=>'Payment due: '+o.id+' '+R(bal(o)))];return `<div class="card">${a.map(x=>`<p>🔔 ${x}</p>`).join('')}</div>`}
function view(){const m={dash,journey,est,reports,alerts};return m[page]?m[page]():C[page]?table(page):''}
function go(keep){const t=(NAV.find(n=>n[0]==page)||[0,'Dashboard'])[1];const sc=$('#q'),pos=sc&&keep;$('#pg').innerHTML=`<h1>${t}</h1><div class="crumb">BAJRANG SOLAR / ${t}</div>${view()}`;if(page=='est')estOut();if(keep){const e=$('#q');e.focus();e.setSelectionRange(99,99)}document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.k==page));const n=DB.products.filter(p=>p.stock<=p.min).length;$('#bell').textContent='🔔 '+n}
const nav=k=>{page=k;$('.side').classList.remove('o');go()};
function gsearch(v){const box=$('#gs');if(v.length<2){box.innerHTML='';return}const hit=[];Object.keys(C).forEach(k=>rows(k).forEach(r=>{if(JSON.stringify(r).toLowerCase().includes(v.toLowerCase()))hit.push([k,r])}));box.innerHTML=`<div class="card" style="position:absolute;top:44px;width:360px;max-width:90vw;z-index:9">${hit.slice(0,8).map(h=>`<p style="margin:4px 0;cursor:pointer" onclick="S['${h[0]}']={q:'${v}',f:'',p:0};nav('${h[0]}');$('#gs').innerHTML=''">${h[1].id||h[1].code} · ${h[1].name||h[1].cust||''} <small style="color:var(--mut)">${h[0]}</small></p>`).join('')||'No results'}</div>`}
function app(){const ok=ROLES[role]=='*'?NAV:NAV.filter(n=>/dash|journey|alerts/.test(n[0])||ROLES[role].split(' ').includes(n[0]));if(!ok.find(n=>n[0]==page))page='dash';
$('#root').innerHTML=`<div class="app"><aside class="side"><div class="logo"><i>☀</i><div><b>BAJRANG SOLAR</b><small>Solar Energy Solutions</small></div></div><div class="nav">${ok.map(n=>`<a data-k="${n[0]}" onclick="nav('${n[0]}')">${n[1]}</a>`).join('')}</div></aside><div class="main"><div class="top"><button class="btn s" id="mb" onclick="$('.side').classList.toggle('o')">☰</button><div style="position:relative;flex:1"><input id="gsi" placeholder="Global search: customers, leads, quotes, orders…" oninput="gsearch(this.value)" style="width:100%"><div id="gs"></div></div><button class="btn s" id="bell" onclick="nav('alerts')"></button><select class="st" onchange="role=this.value;app()">${Object.keys(ROLES).map(r=>`<option ${r==role?'selected':''}>${r}</option>`).join('')}</select><button class="btn s" onclick="login()">Logout</button></div><div class="pad" id="pg"></div></div></div>`;go()}
function login(){$('#root').innerHTML=`<div id="login"><div class="card f"><div class="logo" style="color:var(--tx)"><i>☀</i><div><b>BAJRANG SOLAR</b><small>Solar Energy Solutions</small></div></div><label>Email</label><input id="em" value="admin@bajranggsolar.demo"><label>Password</label><input id="pw" type="password" value="Admin@123"><label>Role</label><select id="rl">${Object.keys(ROLES).map(r=>`<option>${r}</option>`).join('')}</select><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" style="width:auto" checked> Remember me</label><button class="btn" style="width:100%;margin-top:14px" onclick="role=$('#rl').value;app()">Login</button><p style="text-align:center;color:var(--mut);font-size:12px">Forgot password? · Demo: Admin@123</p></div></div>`;$('#rl').value='Admin'}
login();
</script></body></html>
